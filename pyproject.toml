[project]
name = "django-redis-ng"
version = "6.0.0b2"
description = "Full featured redis cache backend for Django (Next Generation)"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.12"
keywords = ["django", "redis", "cache", "session", "backend"]
authors = [
  { name = "Andrei Antoukh", email = "niwi@niwi.nz" },
  { name = "Oliver Haas", email = "ohaas@e1plus.de" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = ["Django>=5.2,<6.1", "redis>=5.2.1,<6"]

[project.optional-dependencies]
hiredis = ["redis[hiredis]>=5.2.1,<6"]

[project.urls]
Homepage = "https://github.com/oliverhaas/django-redis-ng"
Documentation = "https://oliverhaas.github.io/django-redis-ng/"
Repository = "https://github.com/oliverhaas/django-redis-ng.git"
Changelog = "https://oliverhaas.github.io/django-redis-ng/reference/changelog/"

[dependency-groups]
dev = [
  "django-stubs==5.2.9",
  "lz4==4.4.5",
  "msgpack==1.1.2",
  "mypy==1.19.1",
  "pre-commit==4.5.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "pytest-django==4.11.1",
  "pytest-mock==3.15.1",
  "pytest-xdist==3.8.0",
  "backports-zstd==1.3.0; python_version < '3.14'",
  "ruff==0.14.13",
  "testcontainers==4.14.0",
]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.6.3", "mike==2.1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_redis"]

[tool.hatch.build.targets.sdist]
include = ["django_redis", "LICENSE", "README.md"]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
  "A",      # flake8-builtins
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "C90",    # mccabe complexity
  "COM",    # flake8-commas
  "DJ",     # flake8-django
  "E",      # pycodestyle errors
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "F",      # pyflakes
  "G",      # flake8-logging-format
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "INP",    # flake8-no-pep420
  "INT",    # flake8-gettext
  "ISC",    # flake8-implicit-str-concat
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF100", # unused-noqa
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TCH",    # flake8-type-checking
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # pycodestyle warnings
  "YTT",    # flake8-2020
]
ignore = [
  "S311", # Standard pseudo-random generators (not cryptographic)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"] # Allow assert in tests
"tests/settings/*.py" = ["S105"] # Allow hardcoded passwords in test settings
"django_redis/serializers/pickle.py" = ["A005", "S301"] # Pickle is intentional
"django_redis/serializers/json.py" = [
  "A005",
] # Intentionally named to match format
"django_redis/compressors/gzip.py" = [
  "A005",
] # Intentionally named to match format
"django_redis/compressors/lzma.py" = [
  "A005",
] # Intentionally named to match format
"django_redis/compressors/zlib.py" = [
  "A005",
] # Intentionally named to match format
"django_redis/client/mixins/sorted_sets.py" = ["A002"] # min/max match Redis API

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
pretty = true
show_error_codes = true
show_error_context = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_unreachable = false
# These error codes are disabled due to redis-py type annotation issues.
# See: https://github.com/redis/redis-py/issues/3497
# See: https://github.com/redis/redis-py/issues/3107
disable_error_code = [
  "arg-type",   # redis-py expects str keys but we use KeyT (str | bytes | memoryview)
  "assignment", # Redis vs RedisCluster type assignments in cluster client
  "type-var",   # TypeVar issues with redis-py generics (e.g., zadd)
]

[tool.django-stubs]
django_settings_module = "tests.settings.base"

[[tool.mypy.overrides]]
module = "lz4.frame"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "xdist.scheduler"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "backports.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["compression", "compression.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msgpack"
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings.base"
addopts = "--cov=django_redis --cov-report=term-missing --no-cov-on-fail"
pythonpath = ["tests"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
precision = 1
skip_covered = true
