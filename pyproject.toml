[project]
name = "django-redis-ng"
version = "6.0.0"
description = "Full featured redis cache backend for Django (Next Generation)"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
keywords = ["django", "redis", "cache", "session", "backend"]
authors = [
  { name = "Andrei Antoukh", email = "niwi@niwi.nz" },
  { name = "Oliver Haas", email = "ohaas@e1plus.de" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = ["Django>=4.2,<5.3", "redis>=4.0.2"]

[project.optional-dependencies]
hiredis = ["redis[hiredis]>=4.0.2"]

[project.urls]
Homepage = "https://github.com/oliverhaas/django-redis-ng"
Documentation = "https://oliverhaas.github.io/django-redis-ng/"
Repository = "https://github.com/oliverhaas/django-redis-ng.git"
Changelog = "https://oliverhaas.github.io/django-redis-ng/reference/changelog/"

[dependency-groups]
dev = [
  "django-stubs>=5.0.0",
  "lz4>=0.15",
  "msgpack>=0.6.0",
  "mypy>=1.10.0",
  "pre-commit>=3.5.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-django>=4.8.0",
  "pytest-mock>=3.14.0",
  "pytest-xdist>=3.5.0",
  "pyzstd>=0.15",
  "ruff>=0.5.0",
  "types-redis>=4.6.0",
]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.5.0", "mike>=2.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_redis"]

[tool.hatch.build.targets.sdist]
include = ["django_redis", "LICENSE", "README.md"]
