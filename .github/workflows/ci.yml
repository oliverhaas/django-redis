name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format check
        run: uv run ruff format --check

      - name: Run mypy check
        run: uv run mypy django_redis/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
        django-version:
          - "4.2"
          - "5.1"
          - "5.2"
        redis-py-version:
          - "latest"

        include:
          # Python 3.9 with Django 4.2
          - python-version: "3.9"
            django-version: "4.2"
            redis-py-version: "latest"

          # Python 3.13 with latest Django
          - python-version: "3.13"
            django-version: "5.2"
            redis-py-version: "latest"

          # Pre-release redis-py
          - python-version: "3.13"
            django-version: "5.2"
            redis-py-version: "master"

          # Pre-release Django
          - python-version: "3.13"
            django-version: "main"
            redis-py-version: "latest"

        exclude:
          # Django 5.1+ requires Python 3.10+
          - python-version: "3.10"
            django-version: "4.2"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install Django ${{ matrix.django-version }}
        run: |
          if [ "${{ matrix.django-version }}" = "main" ]; then
            uv pip install "Django @ git+https://github.com/django/django.git@main"
          else
            uv pip install "Django~=${{ matrix.django-version }}.0"
          fi

      - name: Install redis-py ${{ matrix.redis-py-version }}
        if: matrix.redis-py-version == 'master'
        run: uv pip install "redis @ git+https://github.com/redis/redis-py.git@master"

      - name: Start Redis with Docker Compose
        run: docker compose -f docker/docker-compose.yml up -d --wait

      - name: Run tests
        run: uv run pytest -n auto --cov=django_redis --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          env_vars: PYTHON,DJANGO,REDIS_PY
          flags: tests
        env:
          PYTHON: ${{ matrix.python-version }}
          DJANGO: ${{ matrix.django-version }}
          REDIS_PY: ${{ matrix.redis-py-version }}
